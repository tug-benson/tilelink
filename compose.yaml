services:
  tilelink:
    build: .
    image: tilelink:latest
    container_name: tilelink
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Shared admin-team password (add/remove tiles via the UI).
      # Public read: viewers don't need it.
      # Change it! e.g. in an .env file: ADMIN_TOKEN=a-strong-password
      - PORT=80
      - ADMIN_TOKEN=${ADMIN_TOKEN:-changeme}
    volumes:
      # Manual editing possible (re-read on every refresh, no-cache).
      - ./config.yaml:/app/config.yaml:ro
      # UI-created tiles (written by the backend — don't set :ro).
      - ./custom.json:/app/custom.json
      # Local icons + uploads (reference via "icons/my-app.png").
      - ./icons:/app/icons
